<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gmail Contacts Sync</title>
<style>
body{font:14px system-ui,sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#1a73e8;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0;flex:1}
main{padding:12px;max-width:1000px;margin:auto}
button{border:0;border-radius:6px;padding:7px 12px;cursor:pointer;background:#fff;color:#1a73e8;font-weight:600}
button.p{background:#1a73e8;color:#fff}button:disabled{opacity:.5}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
#msg{margin:8px 0;padding:8px;border-radius:6px;background:#fff7d6;min-height:18px;font-weight:600}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:6px;overflow:hidden}
th,td{padding:6px 8px;border-bottom:1px solid #eee;text-align:left}
th{background:#eef2f6;font-size:12px}
.t{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;font-weight:600}
.synced{background:#d9f2e0;color:#176b34}.pending,.changed{background:#fff2cc;color:#8a6200}.error{background:#fbd5d5;color:#a11}.nophone,.skip{background:#e5e5e5;color:#555}
.w{overflow-x:auto}
#msg:empty{display:none}
details{position:relative}summary{list-style:none;cursor:pointer;background:#fff;color:#1a73e8;font-weight:700;border-radius:6px;padding:6px 12px}summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:36px;z-index:5;background:#fff;color:#222;border-radius:8px;box-shadow:0 4px 16px #0004;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:230px}
.menu button{background:#eef2f6}.menu input[size]{width:44px}
small{color:#888;font-size:11px;display:block}
.ri{background:none;padding:0 4px;font-size:16px;line-height:1}td.g{max-width:200px;overflow-wrap:anywhere}.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}td.s{text-align:center;white-space:nowrap}
</style></head><body>
<header><h1>Guests &rarr; Gmail <small style="color:#cfe0ff;display:inline" id="acct"></small></h1><details><summary>&#9776; Menu</summary><div class="menu"><label><input type="checkbox" id="auto"> Auto-sync on new / edited bookings</label><label>Default country code +<input id="cc" size="3" placeholder="44"></label><button id="ref">Refresh list</button><button id="conn"></button><button id="dis" style="display:none">Disconnect</button></div></details></header>
<main>
<div class="bar">
<button class="p" id="syncAll">Sync all pending</button>
<button id="syncSel">Sync selected</button>
<select id="flt"><option value="">All</option><option>pending</option><option>changed</option><option>synced</option><option>error</option><option>nophone</option></select>
<input id="q" placeholder="Search name / phone">
</div>
<div id="msg"></div>
<div class="w"><table><thead><tr><th><input type="checkbox" id="all"></th><th>Guest</th><th>Phone</th><th>Stay</th></tr></thead><tbody id="tb"></tbody></table></div>
</main>
<script>
// ### 1 --- state + api
let rows=[],st={},key=localStorage.getItem('gk')||'';
const $=id=>document.getElementById(id);
const say=t=>{$('msg').textContent=t};
async function api(d){
  const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8','X-App-Key':key},body:JSON.stringify(d)});
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){throw new Error(t)}
  if(j.error){if(r.status===401){key=prompt('App key')||'';localStorage.setItem('gk',key)}throw new Error(j.error)}
  return j;
}
// ### 2 --- render
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],CY=String(new Date().getFullYear());
const sd=d=>{const[a,b,c]=String(d).split('-');return Number(c)+' '+MN[b-1]+(a!==CY?" '"+a.slice(2):'')};
const lab={synced:'In Gmail',pending:'Not uploaded',changed:'Needs update',error:'Error',nophone:'No phone',skip:'No name'};
function render(){
  const f=$('flt').value,q=$('q').value.toLowerCase();
  const dg=x=>String(x||'').replace(/\D/g,'');
  $('tb').innerHTML=rows.filter(r=>(!f||r.state===f)&&(!q||(r.name+r.phone).toLowerCase().includes(q))).map(r=>`<tr><td><input type="checkbox" class="ck" value="${r.id}" ${['pending','changed','error'].includes(r.state)?'':'disabled'}></td><td class="g"><div class="nm" title="${r.name}">${r.name}</div></td><td>${r.phone||''}${r.raw&&dg(r.raw)!==dg(r.phone)?'<small>was '+r.raw+'</small>':''}<div><span class="t ${r.state}" title="${r.error||r.synced_at||''}">${lab[r.state]}</span>${r.state==='synced'?' <button class="ri" title="Re-upload" data-f="'+r.id+'">&#8635;</button>':''}</div></td><td>${sd(r.arrival)} &ndash; ${sd(r.departure)}<small>${r.apartment||''}</small></td></tr>`).join('');
}
async function load(){
  st=await api({action:'status'});
  $('acct').textContent=st.account;
  $('conn').textContent=st.connected?'Reconnect':'Connect Google';
  $('dis').style.display=st.connected?'':'none';
  $('auto').checked=st.auto;$('cc').value=st.country||'';
  if(!st.configured)say('GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET secrets are not set on this worker.');
  rows=(await api({action:'list'})).bookings;render();
}
// ### 3 --- actions
async function sync(ids){
  if(!st.connected){say('Connect Google first.');return}
  const n=ids?ids.length:rows.filter(r=>['pending','changed','error'].includes(r.state)).length;
  if(!n){say('Nothing to upload.');return}
  if(!confirm('Upload '+n+' booking'+(n>1?'s':'')+' to '+st.account+' contacts?'))return;
  say('Syncing...');
  const bt=document.querySelectorAll('button');bt.forEach(b=>b.disabled=true);
  try{const o=await api({action:'sync',ids});say(`Created ${o.created}, linked ${o.linked}, updated ${o.updated}, failed ${o.failed}. ${(o.errors||[]).join(' | ')}`);await load()}catch(e){say('Error: '+e.message)}
  bt.forEach(b=>b.disabled=false);
}
$('syncAll').onclick=()=>sync(null);
$('syncSel').onclick=()=>{const ids=[...document.querySelectorAll('.ck:checked')].map(c=>c.value);ids.length?sync(ids):say('Tick the box next to a guest first (rows marked No phone cannot be ticked).')};
$('all').onchange=e=>document.querySelectorAll('.ck:not(:disabled)').forEach(c=>c.checked=e.target.checked);
$('flt').onchange=$('q').oninput=render;
$('auto').onchange=async e=>{await api({action:'setAuto',value:e.target.checked})};
$('ref').onclick=()=>{say('Refreshing...');load().then(()=>say('Refreshed.')).catch(e=>say(e.message))};
$('cc').onchange=async e=>{await api({action:'setCountry',value:e.target.value});await load();say('Default country code saved.')};
$('conn').onclick=()=>{location.href='/auth/start?k='+encodeURIComponent(key)};
$('dis').onclick=async()=>{await api({action:'disconnect'});load()};
$('tb').onclick=async e=>{const id=e.target.dataset.f;if(!id)return;await api({action:'forget',id});await sync([id])};
load().catch(e=>say(e.message));
</script></body></html>
