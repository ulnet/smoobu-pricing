<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import Bookings</title>
<style>
  :root {
    --bg: #0f1410; --panel: #161d18; --line: #2a352c;
    --text: #d8e3d8; --dim: #7c8c7c; --accent: #6fbf73; --danger: #d15d5d; --warn: #d98b4a;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:14px; padding:16px; }
  h1 { font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:4px; margin-bottom:12px; }
  .section-head { padding:8px 12px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line); }
  .section-body { padding:10px 12px; }
  label { display:flex; flex-direction:column; font-size:10px; color:var(--dim); gap:3px; }
  input { background:#0c110d; border:1px solid var(--line); color:var(--text); font-family:var(--mono); font-size:13px; padding:7px 8px; border-radius:3px; }
  input[type="date"] { color-scheme:dark; width:130px; }
  input[type="number"] { width:100px; }
  input[type="checkbox"] { padding:0; }
  .field-row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  button { background:transparent; border:1px solid var(--accent); color:var(--accent); font-family:var(--mono); font-size:12px; padding:8px 14px; border-radius:3px; cursor:pointer; margin-top:8px; }
  button:hover { background:rgba(111,191,115,.12); }
  button.warn { border-color:var(--warn); color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  th, td { text-align:left; padding:5px; border-bottom:1px dashed var(--line); }
  #log { max-height:32vh; overflow-y:auto; background:#090c0a; font-size:11px; padding:8px; }
  .entry { padding:6px 0; border-bottom:1px dashed var(--line); }
  .entry .meta.ok { color:var(--accent); } .entry .meta.err { color:var(--danger); }
</style>
</head>
<body>
<h1>Import Bookings</h1>
<div class="sub">smoobu-proxy-v2 &middot; real Smoobu bookings that are not yet in our database</div>

<section>
  <div class="section-body">
    <div class="field-row">
      <label>From<input type="date" id="fromD"></label>
      <label>Nights (window)<input type="number" id="nightsN" min="1" value="180"></label>
      <label>To<input type="date" id="toD"></label>
      <button id="loadBtn">Load missing</button>
    </div>
    <div class="sub" id="status" style="margin-top:8px;"></div>
  </div>
</section>

<section id="resSection" style="display:none;">
  <div class="section-head">Not in our database</div>
  <div class="section-body">
    <table><thead><tr><th><input type="checkbox" id="allCb" checked></th><th>Guest</th><th>Property / listing</th><th>Arrive</th><th>Depart</th><th>Channel</th><th>Earning</th></tr></thead><tbody id="body"></tbody></table>
    <button class="warn" id="sendBtn">Send selected to database</button>
  </div>
</section>

<section>
  <div class="section-head">Log</div>
  <div class="section-body" style="padding:0;"><div id="log"></div></div>
</section>

<script>
// ### 1 --- config & state
const WORKER_URL='https://smoobu-proxy-v2.ulnetconzept.workers.dev';
let missing=[],properties=[];
const fromD=document.getElementById('fromD'),toD=document.getElementById('toD'),nightsN=document.getElementById('nightsN'),statusEl=document.getElementById('status'),body=document.getElementById('body'),log=document.getElementById('log');

// ### 2 --- worker call helper (text/plain avoids CORS preflight)
function callWorker(action,extra){
  return fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action},extra||{}))})
    .then(r=>r.text()).then(t=>{try{return JSON.parse(t);}catch(e){throw new Error('Non-JSON: '+t.slice(0,200));}});
}
function logLine(cls,text){
  const d=document.createElement('div');d.className='entry';
  const m=document.createElement('div');m.className='meta '+cls;m.textContent=text;
  d.appendChild(m);log.prepend(d);
}

// ### 3 --- date helpers (window: To = From + Nights)
function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dateObj(s){const p=s.split('-');return new Date(+p[0],p[1]-1,+p[2]);}
function syncTo(){const n=parseInt(nightsN.value,10);if(!fromD.value||!n||n<1)return;const d=dateObj(fromD.value);d.setDate(d.getDate()+n);toD.value=toISO(d);}
function syncNights(){if(!fromD.value||!toD.value)return;const n=Math.round((dateObj(toD.value)-dateObj(fromD.value))/86400000);if(n>=1)nightsN.value=n;}
function setMin(){if(!fromD.value)return;const d=dateObj(fromD.value);d.setDate(d.getDate()+1);toD.min=toISO(d);}
nightsN.addEventListener('input',syncTo);
fromD.addEventListener('change',()=>{setMin();syncTo();});
toD.addEventListener('change',syncNights);

// ### 4 --- helpers
function earning(b){return Math.max(0,(Number(b.price)||0)-(Number(b['commission-included'])||0));}
function propName(id){const p=properties.find(x=>(x.listingIds||[]).includes(String(id)));return p?p.name:'(unassigned)';}
function usable(b){return b.id&&b['guest-name']&&b['guest-name']!=='Blocked Period'&&b['is-blocked-booking']!==true&&b.email!=='blocked@placeholder.local';}

// ### 5 --- load all Smoobu bookings in the window (paged), diff against our database
function fetchSmoobu(from,to){
  const all=[];
  function next(page){
    return callWorker('getBookings',{params:{from:from,to:to,page:page,pageSize:100}}).then(res=>{
      const b=res.body||{};
      (b.bookings||[]).forEach(x=>all.push(x));
      if(b.page_count&&page<b.page_count&&page<30)return next(page+1);
    });
  }
  return next(1).then(()=>all);
}
function loadMissing(){
  if(!fromD.value||!toD.value||toD.value<=fromD.value){statusEl.textContent='Pick a valid window (at least 1 night).';return;}
  statusEl.textContent='Loading...';
  document.getElementById('resSection').style.display='none';
  Promise.all([
    fetchSmoobu(fromD.value,toD.value),
    callWorker('getSimBookings').then(r=>r.bookings||[]),
    callWorker('getMeta',{key:'apartments'}).then(r=>r.value||[])
  ]).then(([sm,db,props])=>{
    properties=props;
    const have=new Set(db.map(x=>x.id)),seen=new Set();
    missing=sm.filter(b=>{if(!usable(b)||seen.has(b.id))return false;seen.add(b.id);return !have.has('smoobu-'+b.id);});
    statusEl.textContent=sm.length+' Smoobu bookings in window, '+missing.length+' not in our database.';
    render();
  }).catch(e=>{statusEl.textContent='Load failed: '+e.message;});
}
document.getElementById('loadBtn').onclick=loadMissing;

// ### 6 --- render + send
function render(){
  body.innerHTML='';
  missing.forEach((b,i)=>{
    const ap=b.apartment||{};
    const tr=document.createElement('tr');
    const cells=['',b['guest-name'],propName(ap.id)+' / '+(ap.name||ap.id),b.arrival,b.departure,(b.channel&&b.channel.name)||'','£'+earning(b).toFixed(2)];
    cells.forEach((c,k)=>{
      const td=document.createElement('td');
      if(k===0){const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.dataset.i=i;td.appendChild(cb);}
      else td.textContent=c;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  document.getElementById('allCb').checked=true;
  document.getElementById('resSection').style.display=missing.length?'block':'none';
}
document.getElementById('allCb').onchange=e=>body.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=e.target.checked);
document.getElementById('sendBtn').onclick=()=>{
  const picked=[...body.querySelectorAll('input[type=checkbox]:checked')].map(c=>missing[+c.dataset.i]);
  if(!picked.length)return;
  if(!confirm('Send '+picked.length+' booking(s) to the database?'))return;
  let ok=0,fail=0;
  Promise.all(picked.map(b=>{
    const ap=b.apartment||{};
    return callWorker('addSimBooking',{
      id:'smoobu-'+b.id,reference_id:b['reference-id']||'',apartment_id:String(ap.id||''),apartment_name:ap.name||'',
      guest_name:b['guest-name'],channel:(b.channel&&b.channel.name)||'',arrival:b.arrival,departure:b.departure,
      details:{contact:b.phone||'',note:'',guests:(Number(b.adults)||0)+(Number(b.children)||0)||'',price:earning(b)}
    }).then(r=>{if(r.success)ok++;else{fail++;logLine('err','#'+b.id+' '+(r.error||'failed'));}}).catch(e=>{fail++;logLine('err','#'+b.id+' '+e.message);});
  })).then(()=>{
    logLine(fail?'err':'ok','Sent '+ok+' OK, '+fail+' failed.');
    loadMissing();
  });
};

// ### 7 --- init
fromD.value=toISO(new Date());setMin();syncTo();
</script>
</body>
</html>
